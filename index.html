<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reisekarte</title>
  <meta name="theme-color" content="#0c6b73">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reisekarte">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <!-- ?v= bei jeder neuen Version erhöhen (wie APP_VERSION in app.js), damit kein Browser die alte Datei weiterverwendet. -->
  <link rel="stylesheet" href="styles.css?v=2026-10-27.1">
</head>
<body>
  <div class="app">
    <aside class="panel" aria-label="Reiseplan">
      <header class="panel-head">
        <div class="head-row">
          <div class="brand">Reisekarte <span id="app-version" class="app-version"></span></div>
          <div class="head-actions">
            <button id="today-btn" class="btn primary" data-action="today" hidden>Heute</button>
            <button id="sync-btn" class="btn ghost sync-btn" data-action="open-sync">Online-Sync</button>
            <div class="menu-wrap">
              <button id="menu-btn" class="btn ghost menu-btn" data-action="toggle-menu" aria-haspopup="true" aria-expanded="false" aria-controls="trip-menu" title="Weitere Aktionen">⋯<span class="sr-only">Weitere Aktionen</span></button>
              <div id="trip-menu" class="menu" role="menu" hidden>
                <button class="menu-item" role="menuitem" data-action="collapse-all">Alle Tage einklappen</button>
                <button class="menu-item" role="menuitem" data-action="expand-all">Alle Tage ausklappen</button>
                <hr>
                <button class="menu-item" role="menuitem" data-action="export">Exportieren (Sicherung mit Fotos)</button>
                <label class="ro-hide menu-item file-btn" role="menuitem">Importieren …
                  <input id="import-file" type="file" accept="application/json,.json">
                </label>
                <hr>
                <button class="ro-hide menu-item" role="menuitem" data-action="sample">Beispielreise laden</button>
                <button class="ro-hide menu-item danger" role="menuitem" data-action="clear-all">Neu anfangen</button>
              </div>
            </div>
          </div>
        </div>
        <input id="trip-title" class="trip-title" type="text" aria-label="Name der Reise" placeholder="Name der Reise">
        <div class="trip-meta">
          <label class="date-field">Anreise
            <input id="start-date" type="date">
          </label>
          <span id="trip-summary" class="trip-summary"></span>
          <button id="map-toggle" class="btn ghost mobile-only" data-action="toggle-map">Karte ausblenden</button>
        </div>
      </header>

      <p id="ro-banner" class="ro-banner" hidden>👁 Nur lesen: Diese Reise wurde mit dir zum Lesen geteilt.</p>
      <div id="days" class="days"></div>

      <div class="panel-foot">
        <button class="add-btn add-day ro-hide" data-action="add-day">+ Tag hinzufügen</button>
      </div>
    </aside>

    <div id="resizer" class="resizer" role="separator" tabindex="0" aria-label="Größe von Liste und Karte ändern (Pfeiltasten, Doppelklick setzt zurück)" title="Ziehen, um Liste und Karte zu vergrößern oder zu verkleinern"></div>

    <main class="map-wrap">
      <div id="map" aria-label="Karte der Reiseroute"></div>
      <div id="pick-banner" class="pick-banner" hidden>
        <span>Klicke auf die Karte, um den Ort zu setzen.</span>
        <button class="btn" data-action="cancel-map-pick">Abbrechen</button>
      </div>
      <div class="map-tools">
        <button class="btn map-btn" data-action="fit-all">Ganze Reise</button>
        <button id="retry-btn" class="btn map-btn" data-action="retry-routes" hidden title="Fehlgeschlagene Routen erneut abfragen">Routen neu laden</button>
        <button id="follow-btn" class="btn map-btn" data-action="toggle-follow" aria-pressed="true" title="Beim Scrollen der Liste zeigt die Karte den Tag, den du gerade siehst">Folgt der Liste</button>
      </div>
      <div class="legend" aria-label="Legende">
        <button class="legend-toggle" data-action="toggle-legend" aria-expanded="true">Legende</button>
        <div class="legend-row"><span class="lg-pin">⌂</span>Unterkunft · Nächte</div>
        <div class="legend-row"><span class="lg-line lg-transfer"></span>Ortswechsel</div>
        <div class="legend-row"><span class="lg-line lg-trip"></span>Ausflug (Farbe = Tag)</div>
        <div class="legend-row"><span class="lg-line lg-train"></span>Zug</div>
        <div class="legend-row"><span class="lg-line lg-flight"></span>Flug</div>
        <div class="legend-row"><span class="lg-line lg-ferry"></span>Fähre</div>
        <div class="legend-row"><span class="lg-line lg-air"></span>Luftlinie (keine Route)</div>
      </div>
    </main>
  </div>

  <div id="lightbox" class="lightbox" data-action="close-photo" hidden>
    <img id="lightbox-img" alt="Foto in voller Größe">
    <button class="btn" data-action="close-photo">Schließen</button>
  </div>

  <dialog id="sync-dialog" class="sync-dialog" aria-labelledby="sync-title">
    <div class="sync-head">
      <h2 id="sync-title" class="editor-title">Online-Sync</h2>
      <button class="icon-btn" data-action="close-sync" aria-label="Schließen" title="Schließen">×</button>
    </div>
    <div id="sync-body" class="sync-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/pocketbase/pocketbase.umd.js"></script>
  <script src="app.js?v=2026-10-27.1"></script>
</body>
</html>
